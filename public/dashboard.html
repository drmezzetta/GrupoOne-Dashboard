<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrupoOne — Panel de ventas &amp; stock</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="brand">GrupoOne</div>
        <div class="eyebrow">Panel de ventas &amp; stock</div>
      </div>
      <div class="header-right">
        <select id="empresaSelect" class="chip-select" aria-label="Empresa"></select>
        <select id="sucursalSelect" class="chip-select" aria-label="Sucursal"></select>
        <select id="rangoSelect" class="chip-select" aria-label="Rango de fechas">
          <option value="7">Últimos 7 días</option>
          <option value="30" selected>Últimos 30 días</option>
          <option value="90">Últimos 90 días</option>
        </select>
        <div id="userChip" class="user-chip" title=""></div>
        <form action="/auth/logout" method="post"><button class="logout-btn" type="submit">Salir</button></form>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <!-- KPIs -->
    <section id="kpiRow" class="kpi-row"></section>

    <!-- Trend + categories -->
    <section class="grid-2">
      <div class="card chart-card">
        <div class="card-head">
          <span class="card-title">Tendencia de ventas — unidades por tramo</span>
        </div>
        <svg id="trendSvg" width="848" height="190" viewBox="0 0 848 190"></svg>
        <div id="trendAxis" class="trend-axis"></div>
      </div>
      <div class="card">
        <div class="card-title" style="margin-bottom:18px;">Ventas por categoría</div>
        <div class="donut-row">
          <div id="donut" class="donut"><div id="donutCenter" class="donut-center"></div></div>
          <div id="categoryLegend" class="legend-list"></div>
        </div>
      </div>
    </section>

    <!-- Table + alerts -->
    <section class="grid-2">
      <div class="card">
        <div class="card-title" style="margin-bottom:8px;">Top productos — período actual</div>
        <table class="data-table">
          <thead>
            <tr><th>SKU</th><th>Descripción</th><th>Categoría</th><th class="num">Unidades</th><th class="num">Importe</th><th class="num">Cobertura</th></tr>
          </thead>
          <tbody id="productsBody"></tbody>
        </table>
      </div>
      <div class="card">
        <div class="card-title" style="margin-bottom:14px;">Alertas de stock</div>
        <div id="alertsList" class="alerts-list"></div>
      </div>
    </section>

    <div class="footnote" id="footnote"></div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
